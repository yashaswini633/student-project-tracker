
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Project Tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Student Project Tracker</h1>
      <p>Keep track of your electronics projects, their progress, and current status.</p>
    </header>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Add a Project</h2>

      <form id="project-form">
        <div>
          <label for="project-name">Project name</label>
          <input
            type="text"
            id="project-name"
            name="projectName"
            placeholder="e.g. IoT Monitor"
            required
          >
        </div>

        <div>
          <label for="project-status">Project status</label>
          <select id="project-status" name="projectStatus">
            <option value="Planning">Planning</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div>
          <button type="submit" id="save-button">Add Project</button>
          <button type="button" id="cancel-button" hidden>
            Cancel edit
          </button>
        </div>
      </form>

      <p id="form-message" role="status"></p>
    </section>

    <section aria-labelledby="projects-heading">
      <h2 id="projects-heading">Your Projects</h2>
      <p id="empty-message">No projects have been added yet.</p>
      <ul id="project-list"></ul>
    </section>
  </main>

  <script src="/script.js" defer></script>
</body>
</html>
